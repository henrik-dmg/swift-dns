# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [main]
    paths:
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
      - "Package.swift"
      - "Package.resolved"
  pull_request:
    branches: [main]
    paths:
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
      - "Package.swift"
      - "Package.resolved"
  workflow_dispatch:

jobs:
  test-swift:
    name: ${{ matrix.os }} Tests on Swift ${{ matrix.swift }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        swift: ["6.0.2"]
    steps:
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Run tests
        run: swift test --enable-code-coverage -v
      - name: Convert coverage report
        if: runner.os == 'macOS'
        continue-on-error: true
        run: Scripts/convert-coverage-report --target swift-dnsPackageTests
      - name: Upload coverage reports to Codecov
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henrik-dmg/swift-dns

  lint-swift:
    name: Lint Swift Code
    runs-on: macos-latest
    steps:
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Install SwiftLint
        run: brew install swift-format peripheryapp/periphery/periphery
      - name: Lint code
        run: Scripts/lint-swift-code
      - name: Scan for dead code
        run: periphery scan --strict --config config/periphery.yml
