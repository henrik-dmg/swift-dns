name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this value the same as the swift image tag of the Linux job.
  SWIFT_VERSION: "6.4"

jobs:
  test-linux:
    name: Linux Tests
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-spm-
      - name: Run tests
        run: swift test

  test-macos:
    name: macOS Tests
    runs-on: xcode-27
    steps:
      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-spm-
      - name: Run tests
        run: swift test --enable-code-coverage -v
      - name: Convert coverage report
        continue-on-error: true
        run: Scripts/convert-coverage-report
      - name: Upload coverage reports to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henrik-dmg/swift-dns
          swift_project: swift-dns

  verify-rfc-compliance:
    name: RFC Compliance Verification
    runs-on: xcode-27
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dnspython
        run: uv pip install --system dnspython
      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run encoding test with packet output
        env:
          OUTPUT_ENCODED_PACKETS: "1"
        run: swift test --filter DNSPacketTests/encodePacket -v
      - name: Verify packet equivalence with dnspython
        if: failure()
        continue-on-error: true
        run: Scripts/verify-dns-packets
      - name: Upload verification packets as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-packets
          path: tmp/
