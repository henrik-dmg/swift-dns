name: Linting

on:
  push:
    branches: [main]
    paths:
      - "Sources/"
      - "Tests/"
      - "Package.swift"
      - "Package.resolved"
  pull_request:
    branches: [main]
    paths:
      - "Sources/"
      - "Tests/"
      - "Package.swift"
      - "Package.resolved"
  workflow_dispatch:

jobs:
  lint-swift:
    name: Lint Swift Code
    runs-on: macos-latest
    steps:
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Install SwiftLint
        run: brew install swift-format
      - name: Lint code
        run: Scripts/lint-swift-code

  scan-dead-code:
    name: Lint Swift Code
    runs-on: macos-latest
    steps:
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Install SwiftLint
        run: brew install peripheryapp/periphery/periphery
      - name: Scan for dead code
        run: periphery scan --format github-actions --config config/periphery.yml
