name: Linting

on:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/linting.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linting-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: "6.4"

jobs:
  lint-swift:
    name: Lint Swift Code
    runs-on: xcode-27
    steps:
      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Lint code
        run: Scripts/lint-swift-code

  scan-dead-code:
    name: Scan Dead Swift Code
    runs-on: xcode-27
    steps:
      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-periphery-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_VERSION }}-periphery-
      - name: Install periphery
        run: brew install peripheryapp/periphery/periphery
      # The default build system of Swift 6.4 writes no index store, and Periphery needs one.
      # The native build system writes the index store to .build/debug/index/store.
      - name: Build with index store
        run: swift build --build-system native --build-tests
      - name: Scan for dead code
        run: >-
          periphery scan
          --format github-actions
          --config config/periphery.yml
          --skip-build
          --index-store-path .build/debug/index/store
